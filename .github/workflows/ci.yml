name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential linux-headers-generic

      - name: Check source formatting
        run: git diff --check

      - name: Check shell syntax
        run: |
          bash -n scripts/run-kernel-contract-test.sh
          bash -n scripts/run-vtemp-smoke-test.sh

      - name: Install scenario parser
        run: python -m pip install --editable '.[test]'

      - name: Test and validate scenarios
        run: |
          python -m pytest
          vdevlab validate examples/scenarios/*.yaml

      - name: Build kernel module and userspace binaries
        run: |
          kernel_dir="$(find /usr/src -maxdepth 1 -type d \
            -name 'linux-headers-*-generic' | sort -V | tail -n 1)"
          test -n "${kernel_dir}"
          make KDIR="${kernel_dir}" all

      - name: Verify build outputs
        run: |
          test -s kernel/vdevlab_core.ko
          test -x tools/vdevlab-ctl
          test -x tests/vdevlab-contract-test
          test -x examples/vtemp-monitor

      - name: Verify clean target
        run: |
          kernel_dir="$(find /usr/src -maxdepth 1 -type d \
            -name 'linux-headers-*-generic' | sort -V | tail -n 1)"
          make KDIR="${kernel_dir}" clean
