name: Bug report
description: Report reproducible incorrect behavior or a cleanup failure
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private logs, or machine identifiers.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the exact error, report status, or leftover state.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the documented or intended contract.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest scenario and exact commands.
      placeholder: |
        1. ./scripts/setup.sh
        2. sudo ./scripts/demo.sh
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, kernel, architecture, compiler, and Python versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach a redacted JSON report and relevant kernel log excerpt.
  - type: checkboxes
    id: cleanup
    attributes:
      label: Cleanup state
      options:
        - label: I checked for a remaining module, device node, monitor process, and active fault.
          required: true
        - label: I removed secrets and private machine details from the report.
          required: true
