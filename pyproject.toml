[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vdevlab"
version = "0.1.0"
description = "Deterministic Linux device-client resilience scenarios"
requires-python = ">=3.10,<3.13"
license = { text = "GPL-2.0-only" }
dependencies = [
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
]

[project.scripts]
vdevlab = "vdevlab.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["python_tests"]
