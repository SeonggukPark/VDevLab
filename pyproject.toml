[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vdevlab"
version = "0.1.0"
description = "Deterministic Linux device-client resilience scenarios"
requires-python = ">=3.10"
license = { text = "GPL-2.0-only" }
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
vdevlab = "vdevlab.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["python_tests"]
